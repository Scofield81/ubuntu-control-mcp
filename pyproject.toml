[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-control-mcp"
version = "0.1.0"
description = "Ubuntu Control MCP - komplett Linux desktop agent MCP szerver (rendszer, csomagkezeles, persistent terminal, desktop control) beepitett engedely-rendszerrel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Vollai Roland" }]
keywords = ["mcp", "ubuntu", "linux", "desktop-agent", "automation", "ssh"]

dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2.6",
    "psutil>=5.9",
    "paramiko>=3.4",
]

[project.optional-dependencies]
# PTY tamogatas csak Linux/macOS alatt telepul; Windows-on nem kell.
pty = ["ptyprocess>=0.7; sys_platform != 'win32'"]
dev = ["ruff>=0.4", "pytest>=8"]

[project.scripts]
ubuntu-control-mcp = "ubuntu_control_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ubuntu_control_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
